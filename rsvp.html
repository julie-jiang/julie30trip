<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julie's 30th 🌴 RSVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sand: #f5e6d3;
      --sand-light: #faf3eb;
      --terracotta: #c1654f;
      --terracotta-dark: #a34e3a;
      --ocean: #2a7c8a;
      --ocean-light: #e8f4f6;
      --jungle: #4a7c59;
      --sunset: #e8945a;
      --coral: #e07c6a;
      --text: #2d2a26;
      --text-light: #6b6560;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--sand);
      color: var(--text);
      min-height: 100dvh;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    /* ── Page Container ── */
    .page {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: translateX(60px);
      overflow-y: auto;
    }
    .page.active {
      opacity: 1;
      pointer-events: all;
      transform: translateX(0);
      z-index: 10;
    }
    .page.exit-left {
      opacity: 0;
      transform: translateX(-60px);
    }

    /* ── Photo Section ── */
    .page-photo {
      width: 100%;
      height: 40vh;
      min-height: 250px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      background: #2d2a26;
    }
    .page-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .page-photo img.pos-bottom {
      object-position: center 70%;
    }
    .page-photo .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      background: linear-gradient(135deg, var(--ocean), var(--jungle));
      color: white;
    }
    .page-photo .overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(to top, var(--sand), transparent);
      z-index: 1;
    }
    .photo-caption {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
      background: rgba(0,0,0,0.45);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      white-space: nowrap;
      z-index: 3;
      pointer-events: none;
    }

    /* ── Content Section ── */
    .page-content {
      flex: 1;
      padding: 1.5rem 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(0,0,0,0.08);
      border-radius: 2px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--terracotta);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .question-number {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      color: var(--terracotta);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .question-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .question-subtitle {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-top: -1rem;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    /* ── Input Styles ── */
    .text-input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 2px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      background: white;
      color: var(--text);
      transition: border-color 0.2s;
      outline: none;
    }
    .text-input:focus {
      border-color: var(--terracotta);
    }
    .text-input::placeholder {
      color: #bbb;
    }

    .option-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-btn {
      padding: 0.85rem 1rem;
      border: 2px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      background: white;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      line-height: 1.3;
    }
    .option-btn:hover {
      border-color: var(--terracotta);
      background: #fff9f6;
    }
    .option-btn.selected {
      border-color: var(--terracotta);
      background: var(--terracotta);
      color: white;
      font-weight: 600;
    }

    .alt-weekend-input {
      margin-top: 0.5rem;
      display: none;
    }
    .alt-weekend-input.visible {
      display: block;
    }

    .scale-container {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .scale-btn {
      width: 56px;
      height: 56px;
      border: 2px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      background: white;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scale-btn:hover {
      border-color: var(--terracotta);
    }
    .scale-btn.selected {
      border-color: var(--terracotta);
      background: var(--terracotta);
      color: white;
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-light);
      max-width: 312px;
    }

    /* ── Navigation ── */
    .nav-buttons {
      display: flex;
      gap: 0.75rem;
      margin-top: auto;
      padding-top: 1.5rem;
    }
    .btn {
      flex: 1;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-back {
      background: rgba(0,0,0,0.06);
      color: var(--text);
      flex: 0.4;
    }
    .btn-back:hover:not(:disabled) {
      background: rgba(0,0,0,0.1);
    }
    .btn-next {
      background: var(--terracotta);
      color: white;
    }
    .btn-next:hover:not(:disabled) {
      background: var(--terracotta-dark);
    }

    /* ── Splash Page ── */
    .splash-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .splash-emoji {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .splash-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }
    .splash-subtitle {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }
    .splash-note {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-top: 1rem;
      line-height: 1.5;
      font-style: italic;
      max-width: 400px;
    }
    .splash-btn {
      margin-top: 2rem;
      padding: 1rem 3rem;
      background: var(--terracotta);
      color: white;
      border: none;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .splash-btn:hover {
      background: var(--terracotta-dark);
      transform: scale(1.03);
    }

    /* ── End / No Pages ── */
    .end-content, .no-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .end-emoji {
      font-size: 5rem;
      margin-bottom: 1rem;
    }
    .end-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.75rem;
    }
    .end-subtitle {
      font-size: 1rem;
      color: var(--text-light);
      line-height: 1.6;
      max-width: 400px;
    }
    .end-summary {
      margin-top: 1.5rem;
      padding: 1.2rem;
      background: white;
      border-radius: 16px;
      text-align: left;
      width: 100%;
      max-width: 400px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .end-summary .label {
      color: var(--text-light);
      font-size: 0.8rem;
    }
    .end-summary .value {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .btn-edit {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: none;
      border: 2px solid rgba(0,0,0,0.15);
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-edit:hover {
      border-color: var(--terracotta);
      color: var(--terracotta);
    }

    /* ── RSVP List ── */
    .rsvp-list {
      margin-top: 1.5rem;
      width: 100%;
      max-width: 400px;
    }
    .rsvp-list-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      text-align: center;
    }
    .rsvp-count {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .rsvp-count strong {
      color: var(--terracotta, #c1654f);
      font-size: 1.05rem;
    }
    .rsvp-person {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .rsvp-person:last-child {
      border-bottom: none;
    }
    .rsvp-name {
      font-weight: 500;
      font-size: 0.95rem;
    }
    .rsvp-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
      white-space: nowrap;
    }
    .rsvp-badge.confirmed {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .rsvp-badge.medium-risk {
      background: #fff3e0;
      color: #e65100;
    }
    .rsvp-badge.high-risk {
      background: #fce4ec;
      color: #c62828;
    }
    .rsvp-loading {
      text-align: center;
      color: var(--text-light);
      font-size: 0.85rem;
      font-style: italic;
      padding: 1rem 0;
    }
    .rsvp-empty {
      text-align: center;
      color: var(--text-light);
      font-size: 0.9rem;
      padding: 1rem 0;
    }

    /* ── Desktop ── */
    @media (min-width: 768px) {
      .page {
        flex-direction: row;
        overflow: hidden;
      }
      .page-photo {
        width: 50%;
        height: 100%;
        min-height: unset;
      }
      .page-photo .overlay {
        display: none;
      }
      .page-content {
        width: 50%;
        padding: 3rem;
        overflow-y: auto;
        justify-content: center;
      }
      .question-text {
        font-size: 1.8rem;
      }
      .splash-content, .end-content, .no-content {
        max-width: 50%;
        margin-left: auto;
      }
      .page.has-photo {
        flex-direction: row;
      }
      .page.has-photo .page-photo {
        width: 50%;
        height: 100%;
      }
    }
  </style>
</head>

      }
    })();

    // ── Fetch RSVP list from published Google Sheet ──
    async function fetchRsvpList() {
      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL === 'YOUR_PUBLISHED_CSV_URL_HERE') {
        return [];
      }
      try {
        const res = await fetch(GOOGLE_SHEET_CSV_URL);
        const text = await res.text();
        const rows = parseCSV(text);
        // Skip header row; columns: Timestamp, Name, Solo/Couple, Partner Name, RSVP, Alt Weekend, Days Off, Days Off Notes, Flake Scale, ...
        // Deduplicate: later rows (same name) override earlier ones
        const byName = new Map();
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 5) continue;
          const name = (row[1] || '').trim();
          const plusOne = (row[2] || '').trim();
          const partnerName = (row[3] || '').trim();
          const rsvp = (row[4] || '').trim();
          const flakeScale = parseInt(row[8]) || 0;

          if (!name) continue;

          const nameKey = name.toLowerCase();
          byName.set(nameKey, { name, plusOne, partnerName, rsvp, flakeScale });
        }

        const people = [];
        for (const entry of byName.values()) {
          const { name, plusOne, partnerName, rsvp, flakeScale } = entry;

          // Determine flake risk
          const isWobbly = rsvp.includes('50/50') || rsvp.includes('Most likely no');
          const isFlakey = flakeScale >= 3;
          let flakeRisk = null;
          if (isWobbly && isFlakey) flakeRisk = 'high';
          else if (isWobbly || isFlakey) flakeRisk = 'medium';

          // Only show people who said yes-ish (not hard no)
          const isNo = rsvp.includes('NO') || rsvp.includes('Most likely no');
          if (isNo) continue;

          const displayName = plusOne.includes('partner') && partnerName
            ? `${name} & ${partnerName}`
            : name;

          people.push({ displayName, rsvp, flakeRisk });
        }
        return people;
      } catch {
        return [];
      }
    }

    function parseCSV(text) {
      const rows = [];
      let current = [];
      let field = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"' && text[i + 1] === '"') {
            field += '"';
            i++;
          } else if (c === '"') {
            inQuotes = false;
          } else {
            field += c;
          }
        } else {
          if (c === '"') {
            inQuotes = true;
          } else if (c === ',') {
            current.push(field);
            field = '';
          } else if (c === '\n' || (c === '\r' && text[i + 1] === '\n')) {
            current.push(field);
            field = '';
            rows.push(current);
            current = [];
            if (c === '\r') i++;
          } else {
            field += c;
          }
        }
      }
      if (field || current.length) {
        current.push(field);
        rows.push(current);
      }
      return rows;
    }

    function isCouple() {
      return answers.plusOne === 'Me + my partner 💕';
    }

    function totalQuestions() {
      // solo: name, +1, rsvp, daysOff, flake, shareBed, shareRoom, datePrefs = 8
      // couple: name, +1 (with partner name), rsvp, daysOff, flake, shareRoom, datePrefs = 7
      return isCouple() ? 7 : 8;
    }

      // 7: Share a bed (solo only)

    }

    function renderQuestion(page, idx) {
      let inputHTML = '';

      if (page.inputType === 'text') {
        inputHTML = `
          <input type="text" class="text-input" id="input-${page.key}"
            placeholder="${page.placeholder}"
            value="${answers[page.key] || ''}"
            oninput="answers['${page.key}'] = this.value; updateNav();">
        `;
      } else if (page.inputType === 'options') {
        inputHTML = '<div class="option-grid">';
        page.options.forEach(opt => {
          const isSelected = answers[page.key] === opt;
          inputHTML += `
            <button class="option-btn ${isSelected ? 'selected' : ''}"
              onclick="selectOption('${page.key}', this, '${opt.replace(/'/g, "\\'")}', ${idx})">
              ${opt}
            </button>
          `;
        });
        inputHTML += '</div>';

        if (page.hasAltInput) {
          const altTrigger = page.altTrigger || page.options[page.options.length - 1];
          const altKey = page.altKey || (page.key + '_alt');
          const isAltVisible = answers[page.key] === altTrigger;
          inputHTML += `
            <div class="alt-weekend-input ${isAltVisible ? 'visible' : ''}" id="alt-input-${page.key}">
              <input type="text" class="text-input" id="alt-text-${page.key}"

                value="${answers[altKey] || ''}"

                style="margin-top: 0.6rem;">

        }
      } else if (page.inputType === 'scale') {
        inputHTML = '<div class="scale-container">';
        for (let n = page.scaleMin; n <= page.scaleMax; n++) {
          const isSelected = answers[page.key] === n;
          inputHTML += `
            <button class="scale-btn ${isSelected ? 'selected' : ''}"
              onclick="selectScale('${page.key}', ${n}, this)">
              ${n}
            </button>
          `;

        inputHTML += '</div>';
        inputHTML += `
          <div class="scale-labels">
            <span>${page.scaleLabels[0]}</span>
            <span>${page.scaleLabels[1]}</span>
          </div>

      const pages = getPages();
      const isLastQuestion = idx === pages.length - 3;

      return `
        ${buildPhotoHTML(page.image)}
        <div class="page-content">

            <div class="progress-fill" style="width: ${page.progress * 100}%"></div>

    // ── Navigation Logic ──
    function canProceed(idx) {
      const pages = getPages();
      const page = pages[idx];
      if (!page || page.type !== 'question') return true;
      if (page.skippable) return true;
      const val = answers[page.key];
      if (page.inputType === 'text') return val && val.trim().length > 0;
      if (val === undefined || val === null) return false;
      // If this page has an alt input with a trigger, and the trigger is selected, require the alt field
      if (page.hasAltInput && page.altTrigger && val === page.altTrigger) {
        const altKey = page.altKey || (page.key + '_alt');
        const altVal = answers[altKey];
        return altVal && altVal.trim().length > 0;
      }
      return true;
    }

    function updateNav() {
      const btn = document.getElementById(`nav-next-${currentPage}`);
      if (btn) btn.disabled = !canProceed(currentPage);
    }

    function selectOption(key, btnEl, value, pageIdx) {
      answers[key] = value;

      const allBtns = btnEl.parentElement.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.classList.remove('selected'));
      btnEl.classList.add('selected');

      const pages = getPages();
      const page = pages[pageIdx];
      if (page && page.hasAltInput) {
        const altTrigger = page.altTrigger || page.options[page.options.length - 1];
        const altKey = page.altKey || (key + '_alt');
        const altDiv = document.getElementById(`alt-input-${key}`);
        if (altDiv) {
          if (value === altTrigger) {
            altDiv.classList.add('visible');
            setTimeout(() => {
              const altInput = document.getElementById(`alt-text-${key}`);
              if (altInput) altInput.focus();
            }, 100);
          } else {
            altDiv.classList.remove('visible');
            answers[altKey] = '';
          }
        }
      }

      updateNav();
    }

    function selectScale(key, value, btnEl) {
      answers[key] = value;
      const allBtns = btnEl.parentElement.querySelectorAll('.scale-btn');
      allBtns.forEach(b => b.classList.remove('selected'));
      btnEl.classList.add('selected');
      updateNav();
    }

    function skipQuestion(idx) {
      const pages = getPages();
      answers[pages[idx].key] = '';
      goNext();
    }

    function isDeclined() {
      const val = answers.rsvp;
      return val === 'Most likely no 👎' || val === 'NO 😭';
    }

    function editResponses() {
      submitted = false;
      currentPage = 1;
      const current = document.querySelector('.page.active');
      if (current) current.classList.remove('active');
      renderPage();
    }

    function startEdit() {
      submitted = false;
      currentPage = 1;
      const current = document.querySelector('.page.active');
      if (current) current.classList.remove('active');
      renderPage();
    }

    // ── RSVP List Rendering ──
    function countGuests(people) {
      // A couple's displayName is "A & B" and counts as 2 guests.
      let total = 0;
      for (const p of people) {
        total += (p.displayName && p.displayName.includes(' & ')) ? 2 : 1;
      }
      return total;
    }

    function buildRsvpListHTML(people) {
      if (!people || people.length === 0) {
        return '<div class="rsvp-empty">No RSVPs yet — you\'re the first! 🎉</div>';
      }

      const guestCount = countGuests(people);
      let html = `<div class="rsvp-count">🎉 <strong>${guestCount}</strong> ${guestCount === 1 ? 'guest is' : 'guests are'} coming so far!</div>`;
      for (const p of people) {
        let badgeHTML = '';
        if (p.flakeRisk === 'high') {
          badgeHTML = '<span class="rsvp-badge high-risk">might flake 😬</span>';
        } else if (p.flakeRisk === 'medium') {
          badgeHTML = '<span class="rsvp-badge medium-risk">on the fence 🤔</span>';
        } else {
          badgeHTML = '<span class="rsvp-badge confirmed">locked in ✅</span>';
        }
        html += `
          <div class="rsvp-person">
            <span class="rsvp-name">${p.displayName}</span>
            ${badgeHTML}
          </div>
        `;
      }
      return html;
    }

    async function loadRsvpList(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;

      const people = await fetchRsvpList();

      // Inject the current submission only if they JUST submitted this session
      // (not on page reload — trust the sheet as source of truth)
      if (justSubmittedNow && answers.name && answers.rsvp && !isDeclined()) {
        const displayName = isCouple()
          ? `${answers.name} & ${answers.partnerName}`
          : answers.name;
        const alreadyInList = people.some(p =>
          p.displayName.toLowerCase() === displayName.toLowerCase()
        );
        if (!alreadyInList) {
          const flakeScale = parseInt(answers.flakeScale) || 0;
          const isWobbly = (answers.rsvp || '').includes('50/50');
          const isFlakey = flakeScale >= 3;
          let flakeRisk = null;
          if (isWobbly && isFlakey) flakeRisk = 'high';
          else if (isWobbly || isFlakey) flakeRisk = 'medium';
          people.push({ displayName, rsvp: answers.rsvp, flakeRisk });
        }
      }

      rsvpList = people;

      container.innerHTML = `
        <div class="rsvp-list-title">Who's coming 👀</div>
        ${buildRsvpListHTML(people)}
      `;
    }

        current.classList.remove('active');
        current.classList.add('exit-left');

      const app = document.getElementById('app');
      const div = document.createElement('div');
      div.className = 'page has-photo';
      div.innerHTML = `
        ${buildPhotoHTML('end')}
        <div class="end-content">
          <div class="end-emoji">🌴👀</div>
          <div class="rsvp-list" id="rsvp-list-standalone">
            <div class="rsvp-loading">Loading RSVPs...</div>
          </div>
          <button class="btn-edit" style="margin-top:1.5rem;" onclick="location.reload()">← Back</button>
        </div>
      `;

      setTimeout(() => {
        app.querySelectorAll('.page:not(.active)').forEach(p => {
          if (p !== div) p.remove();
        });
      }, 600);

      app.appendChild(div);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          div.classList.add('active');
        });
      });

      loadRsvpList('rsvp-list-standalone');
    }

    // ── Google Sheets Submission ──
    function submitToGoogleForm() {
      if (submitted) return;
      submitted = true;
      justSubmittedNow = true;
      saveSubmission();

      const payload = {
        name: answers.name || '',
        plusOne: answers.plusOne || '',
        partnerName: answers.partnerName || '',
        rsvp: answers.rsvp || '',
        rsvp_alt: answers.rsvp_alt || '',
        daysOff: answers.daysOff || '',
        daysOff_alt: answers.daysOff_alt || '',
        flakeScale: answers.flakeScale || '',
        shareBed: isCouple() ? 'N/A (couple)' : (answers.shareBed || ''),
        shareRoom: answers.shareRoom || '',
        datePrefs: answers.datePrefs || '',
      };

      if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        }).catch(() => {});
      }
    }

    function goNext() {
      const current = document.querySelector('.page.active');
      if (current) {
        current.classList.remove('active');
        current.classList.add('exit-left');
      }

      const pages = getPages();
      const currentPageData = pages[currentPage];

      // After RSVP, check if declined → jump to "no" page
      if (currentPageData && currentPageData.key === 'rsvp' && isDeclined()) {
        currentPage = pages.length - 1;
        submitToGoogleForm();
      } else {
        currentPage++;
        // Rebuild pages now (the +1 answer may have changed the page list)
        const newPages = getPages();
        // If we overshot, clamp
        if (currentPage >= newPages.length) {
          currentPage = newPages.length - 2; // end page
        }
        // Submit when reaching end page
        if (newPages[currentPage] && newPages[currentPage].type === 'end') {
          submitToGoogleForm();
        }
      }

      renderPage();
    }

    function goBack() {
      const current = document.querySelector('.page.active');
      if (current) {
        current.classList.remove('active');
      }

      const pages = getPages();
      if (pages[currentPage] && pages[currentPage].type === 'no') {
        // Find the RSVP page
        currentPage = pages.findIndex(p => p.key === 'rsvp');
      } else {
        currentPage--;
      }

      // Reset submitted flag if going back from end
      submitted = false;

      renderPage();
    }

    function renderPage() {
      const app = document.getElementById('app');
      const pages = getPages();
      const page = pages[currentPage];
      const div = document.createElement('div');
      div.className = `page has-photo`;

      if (page.type === 'splash') div.innerHTML = renderSplash(page);
      else if (page.type === 'question') div.innerHTML = renderQuestion(page, currentPage);
      else if (page.type === 'end') div.innerHTML = renderEnd(page);
      else if (page.type === 'no') div.innerHTML = renderNo(page);

      setTimeout(() => {
        app.querySelectorAll('.page:not(.active)').forEach(p => {
          if (p !== div) p.remove();
        });
      }, 600);

      app.appendChild(div);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          div.classList.add('active');
        });
      });

      if (page.inputType === 'text') {
        setTimeout(() => {
          const input = document.getElementById(`input-${page.key}`);
          if (input) input.focus();
        }, 500);
      }

      // Load RSVP list on end page
      if (page.type === 'end') {
        // Small delay to let the form submission land first
        setTimeout(() => loadRsvpList('rsvp-list-end'), 2000);
      }

      // Preload next page's image
      preloadNextImages(currentPage);
    }

    // ── Image Preloading ──
    function preloadNextImages(idx) {
      const pages = getPages();
      // Preload the next 2 pages' images
      for (let offset = 1; offset <= 2; offset++) {
        const nextIdx = idx + offset;
        if (nextIdx < pages.length) {
          const nextPage = pages[nextIdx];
          if (nextPage && nextPage.image && IMAGES[nextPage.image]) {
            const img = new Image();
            img.src = IMAGES[nextPage.image].src;
          }
        }
      }
    }

    // Splash image is inlined as base64 — no preload needed

    // ── Initialize ──
    renderPage();
  </script>
</body>
</html>
